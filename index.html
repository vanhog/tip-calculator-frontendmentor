<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>

    <link rel="stylesheet" href="./styles/tw.css" />
  </head>
  <body class="bg-tc-grey-50">
    <main>
      <div
        id="boxentering"
        class="flex flex-col justify-center items-center h-screen"
      >
        <section id="head">
          <img src="./images/logo.svg" alt="Splitter Logo" class="my-10" />
        </section>
        <div id="centeredbox">
          <div
            class="w-[375px] md:min-w-[608px] lg:w-[920px] lg:h-[481px] bg-white flex flex-col lg:flex-row justify-center items-center gap-3 rounded-t-2xl md:rounded-2xl py-8.5 px-8 mb-12"
          >
            <section
              id="upper"
              class="flex flex-col justify-between min-w-[327px] md:min-w-[457px] lg:min-w-[413px] lg:h-[417px]"
            >
              <!--Input amount------------------------------------------------------->
              <article>
                <label
                  ><span class="tp-5 text-tc-grey-500">Bill </span>
                  <input
                    id="billAmount"
                    placeholder="0"
                    type="number"
                    inputmode="numeric"
                    pattern="\d*"
                    class="bg-[url('../images/icon-dollar.svg')] icon-label-style no-spinner w-full rounded-md p-1 mt-3 tp-3 text-tc-green-900 text-right bg-tc-grey-50 border border-tc-grey-50 focus:outline-none"
                  />
                </label>
              </article>
              <!--Input amount ------------------------------------------------------->

              <!--Buttons ------------------------------------------------------->
              <fieldset>
                <legend class="my-3">
                  <span class="tp-5 text-tc-grey-500">Select tip %</span>
                </legend>
                <ul
                  id="tipSelect"
                  class="grid grid-cols-2 md:grid-cols-3 justify-between items-center gap-3"
                >
                  <li>
                    <button type="button" id="q5" class="button-class tp-3">
                      5%
                    </button>
                  </li>
                  <li>
                    <button type="button" id="q10" class="button-class tp-3">
                      10%
                    </button>
                  </li>
                  <li>
                    <button type="button" id="q15" class="button-class tp-3">
                      15%
                    </button>
                  </li>
                  <li>
                    <button type="button" id="q25" class="button-class tp-3">
                      25%
                    </button>
                  </li>
                  <li>
                    <button type="button" id="q50" class="button-class tp-3">
                      50%
                    </button>
                  </li>
                  <li>
                    <button
                      id="c6"
                      type="button"
                      class="button-class tp-3 bg-tc-grey-50 text-tc-grey-550"
                    >
                      Custom
                    </button>
                  </li>
                </ul>
              </fieldset>
              <!--Buttons ------------------------------------------------------->

              <!--Input people------------------------------------------------------->
              <article>
                <label>
                  <div class="flex flex-row justify-between items-center">
                    <span class="tp-5 text-tc-grey-500">Number of people </span>
                    <div
                      id="errmsg"
                      role="alert"
                      class="tp-5 text-tc-orange-400 hidden"
                      aria-live="assertive"
                      aria-hidden="true"
                    >
                      Can't be zero
                    </div>
                  </div>

                  <input
                    id="numPeople"
                    placeholder="0"
                    type="number"
                    inputmode="numeric"
                    pattern="\d*"
                    aria-invalid="false"
                    class="bg-[url('../images/icon-person.svg')] icon-label-style no-spinner w-full rounded-md p-1 mt-3 tp-3 text-tc-green-900 text-right bg-tc-grey-50 border border-tc-grey-50 focus:outline-none border border-black"
                  />
                </label>
              </article>
              <!--Input people ------------------------------------------------------->
            </section>
            <section
              id="lower"
              class="flex flex-col justify-between bg-tc-green-900 rounded-2xl p-3 min-w-[327px] md:min-w-[457px] lg:min-w-[413px] h-full lg:h-[417px] mt-5 p-6 md:p-9"
            >
              <div id="output-justifier">
                <!--Output tip/person------------------------------------------------>
                <article
                  class="flex flex-row justify-between items-center mt-3 mb-6"
                >
                  <div>
                    <span class="tp-5 text-white">Tip Amount</span> <br /><span
                      class="tp-6 text-tc-grey-400"
                      >/ person</span
                    >
                  </div>
                  <div
                    class="tp-2-mobile text-tc-green-400 flex flex-row justify-end"
                  >
                    <span> $</span>
                    <span id="tipAmountValue">0.00</span>
                  </div>
                </article>
                <!--Output tip/person------------------------------------------------>
                <!--Output total/person---------------------------------------------->
                <article
                  class="flex flex-row justify-between items-center my-5"
                >
                  <div>
                    <span class="tp-5 text-white">Total</span> <br /><span
                      class="tp-6 text-tc-grey-400"
                      >/ person</span
                    >
                  </div>
                  <div
                    class="tp-2-mobile text-tc-green-400 flex flex-row justify-end"
                  >
                    <span> $</span> <span id="perPersonValue">0.00</span>
                  </div>
                </article>
              </div>
              <!--Output total/person---------------------------------------------->
              <!--Reset button----------------------------------------------------->
              <button
                id="resetButton"
                type="button"
                class="w-full rounded-lg p-2 my-3 tp-4 uppercase bg-tc-green-750 text-tc-green-900"
              >
                Reset
              </button>
              <!--Reset button----------------------------------------------------->
            </section>
          </div>
        </div>
      </div>
    </main>

    <footer class="mt-25">
      <h2 class="sr-only">Attributions</h2>
      <div class="attribution mt-6">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          >Frontend Mentor</a
        >. Coded by
        <a
          href="https://github.com/vanhog"
          target="_blank"
          rel="noopener noreferrer"
          >Dieter H. Hoogestraat (dee van hog)</a
        >. Source code:
        <a href="https://github.com/vanhog/tip-calculator-frontendmentor"
          >https://github.com/vanhog/tip-calculator-frontendmentor</a
        >

        <p>For training use only. Do not use in production. No warranty.</p>
      </div>
      <script src="./src/main.js"></script>
    </footer>
  </body>
</html>
