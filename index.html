<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>

    <link rel="stylesheet" href="./styles/tw.css" />
  </head>
  <body class="bg-tc-grey-50">
    <main>
      <div
        id="boxentering"
        class="flex flex-col justify-center items-center h-screen"
      >
        <section id="head">
          <img src="./images/logo.svg" alt="Splitter Logo" class="my-10" />
        </section>
        <div id="centeredbox">
          <div
            class="w-[375px] md:min-w-[608px] lg:w-[920px] lg:h-[481px] bg-white flex flex-col lg:flex-row justify-center items-center gap-3 rounded-t-2xl md:rounded-2xl py-8.5 px-8 mb-12"
          >
            <section
              id="upper"
              class="flex flex-col justify-between min-w-[327px] md:min-w-[457px] lg:min-w-[413px] lg:h-[417px]"
            >
              <!--Input amount------------------------------------------------------->
              <article>
                <label for="bill-amount"
                  ><span class="tp-5 text-tc-grey-500">Bill </span>
                  <input
                    id="bill-amount"
                    type="text"
                    placeholder="0"
                    class="w-full bg-tc-grey-50 rounded-md p-1 mt-3 text-right tp-3 border border-tc-grey-50 focus:outline-none focus:border focus:border-tc-green-400 active:bg-tc-grey-50"
                  />
                </label>
              </article>
              <!--Input amount ------------------------------------------------------->

              <!--Buttons ------------------------------------------------------->
              <article>
                <label for="tip-select"
                  ><span class="tp-5 text-tc-grey-500">Select tip %</span>
                  <div
                    class="grid grid-cols-2 md:grid-cols-3 justify-between items-center gap-3"
                  >
                    <button id="1" class="button-class tp-3">5%</button>
                    <button id="2" class="button-class tp-3">10%</button
                    ><button id="3" class="button-class tp-3">15%</button>
                    <button id="4" class="button-class tp-3">25%</button
                    ><button id="5" class="button-class tp-3">50%</button>
                    <button
                      id="6"
                      class="button-class tp-3 bg-tc-grey-50 text-tc-grey-550"
                    >
                      Custom
                    </button>
                  </div>
                </label>
              </article>
              <!--Buttons ------------------------------------------------------->

              <!--Input people------------------------------------------------------->
              <article>
                <label for="num-people">
                  <div class="flex flex-row justify-between items-center">
                    <span class="tp-5 text-tc-grey-500">Number of people </span
                    ><span
                      id="errormessage"
                      class="tp-5 text-tc-orange-400 hidden"
                      >Can't be zero</span
                    >
                  </div>
                  <input
                    id="num-people"
                    type="text"
                    placeholder="0"
                    class="mt-3 w-full bg-tc-grey-50 rounded-md p-1 text-right tp-3 border border-tc-grey-50 focus:outline-none focus:border focus:border-tc-green-400 active:bg-tc-grey-50"
                  />
                </label>
              </article>
              <!--Input people ------------------------------------------------------->
            </section>
            <section
              id="lower"
              class="flex flex-col justify-between bg-tc-green-900 rounded-2xl p-3 min-w-[327px] md:min-w-[457px] lg:min-w-[413px] h-full lg:h-[417px] mt-5 p-6 md:p-9"
            >
              <div id="output-justifier">
                <!--Output tip/person------------------------------------------------>
                <article
                  class="flex flex-row justify-between items-center mt-3 mb-6"
                >
                  <div>
                    <span class="tp-5 text-white">Tip Amount</span> <br /><span
                      class="tp-6 text-tc-grey-400"
                      >/ person</span
                    >
                  </div>
                  <div
                    class="tp-2-mobile text-tc-green-400 flex flex-row justify-end"
                  >
                    <span> $</span>
                    <span>0.00</span>
                  </div>
                </article>
                <!--Output tip/person------------------------------------------------>
                <!--Output total/person---------------------------------------------->
                <article
                  class="flex flex-row justify-between items-center my-5"
                >
                  <div>
                    <span class="tp-5 text-white">Total</span> <br /><span
                      class="tp-6 text-tc-grey-400"
                      >/ person</span
                    >
                  </div>
                  <div
                    class="tp-2-mobile text-tc-green-400 flex flex-row justify-end"
                  >
                    <span> $</span> <span>0.00</span>
                  </div>
                </article>
              </div>
              <!--Output total/person---------------------------------------------->
              <!--Reset button----------------------------------------------------->
              <button
                type="button"
                class="w-full rounded-lg p-2 my-3 tp-4 uppercase bg-tc-green-750 text-tc-green-900 hover:bg-tc-green-200 hover:text-tc-green-900"
              >
                Reset
              </button>
              <!--Reset button----------------------------------------------------->
            </section>
          </div>
        </div>
      </div>
    </main>

    <footer class="mt-25">
      <h2 class="sr-only">Attributions</h2>
      <div class="attribution mt-6">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          >Frontend Mentor</a
        >. Coded by
        <a
          href="https://github.com/vanhog"
          target="_blank"
          rel="noopener noreferrer"
          >Dieter H. Hoogestraat (dee van hog)</a
        >. Source code:
        <a href="https://github.com/vanhog/tip-calculator-frontendmentor"
          >https://github.com/vanhog/tip-calculator-frontendmentor</a
        >

        <p>For training use only. Do not use in production. No warranty.</p>
      </div>
    </footer>
  </body>
</html>
